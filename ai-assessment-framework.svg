<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">AI in Science Education: From detection to meaningful assessment</title><desc id="d">An adapted visual from the 2026 faculty presentation by Jeremy Rodriguez and Kristin Bartholomew. Three steps show the challenge of AI-written answers, redesigned assessment, and responsible AI use, with attention to data interpretation, explanation, and critical verification.</desc><rect width="1100" height="560" rx="26" fill="#142f42"/><text x="57" y="67" font-family="Arial,sans-serif" font-size="22" fill="#d5b879" font-weight="700" letter-spacing="2">AI IN SCIENCE EDUCATION · 2026</text><text x="57" y="128" fill="#ffffff" font-size="44" font-family="Georgia,serif">Stop catching. Start crafting.</text><text x="57" y="172" fill="#dbeae9" font-family="Arial,sans-serif" font-size="23">Design assessment around what students can explain, evaluate, and demonstrate.</text><rect x="56" y="225" width="303" height="231" rx="17" fill="#f8fbfa"/><rect x="397" y="225" width="303" height="231" rx="17" fill="#f8fbfa"/><rect x="739" y="225" width="303" height="231" rx="17" fill="#f8fbfa"/><text x="80" y="270" font-size="18" font-family="Arial,sans-serif" fill="#0b615e" font-weight="700">01 · THE CHALLENGE</text><text x="80" y="319" font-family="Georgia,serif" font-size="26" fill="#173342">Fluent AI answers</text><text x="80" y="354" font-family="Arial,sans-serif" font-size="19" fill="#334951">can hide gaps in</text><text x="80" y="382" font-family="Arial,sans-serif" font-size="19" fill="#334951">student reasoning.</text><text x="421" y="270" font-size="18" font-family="Arial,sans-serif" fill="#0b615e" font-weight="700">02 · THE REDESIGN</text><text x="421" y="319" font-family="Georgia,serif" font-size="26" fill="#173342">Authentic evidence</text><text x="421" y="354" font-family="Arial,sans-serif" font-size="19" fill="#334951">Data, error analysis,</text><text x="421" y="382" font-family="Arial,sans-serif" font-size="19" fill="#334951">justification, reflection.</text><text x="763" y="270" font-size="18" font-family="Arial,sans-serif" fill="#0b615e" font-weight="700">03 · RESPONSIBLE USE</text><text x="763" y="319" font-family="Georgia,serif" font-size="26" fill="#173342">AI literacy</text><text x="763" y="354" font-family="Arial,sans-serif" font-size="19" fill="#334951">Critical verification and</text><text x="763" y="382" font-family="Arial,sans-serif" font-size="19" fill="#334951">transparent expectations.</text><text x="57" y="517" fill="#d5e9e5" font-size="17" font-family="Arial,sans-serif">Adapted from “AI in Science Education: Designing Assessments That Work” · Rodriguez &amp; Bartholomew</text></svg>